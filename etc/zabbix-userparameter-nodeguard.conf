# nodeguard agent items. The nodeguard watchdog exports a kv snapshot to
# /run/nodeguard/nodeguard.kv every minute; the agent only reads the file
# (zabbix_agent_t cannot make bpf() syscalls, and sudo does not change
# the SELinux domain). ng.ts carries the export epoch for staleness.
# NOTE: the export lives in root-owned /run/nodeguard, not in the agent's
# own /run/zabbix: root must not write into a directory an unprivileged
# identity owns. The agent needs world-read only, which the 0755 tmpfiles
# directory and the writers' explicit 0644 modes give it.
# NOTE: the agent substitutes $1..$9 with item arguments inside the
# command, so awk's field references must be written as $$1/$$2.
UserParameter=nodeguard.kv[*],awk -F= -v k="ng.$1" '$$1==k {print $$2}' /run/nodeguard/nodeguard.kv 2>/dev/null
# Master item for the dependent-item template: one poll per minute reads
# the whole snapshot; every ng.* field parses out server-side.
UserParameter=nodeguard.kv.raw,cat /run/nodeguard/nodeguard.kv 2>/dev/null
