# SAFETY: FEEDS_ENFORCE=no is the mandatory first-run mode. The timer job
# fetches, validates, and writes the diff it WOULD apply; nothing reaches
# block4/block6 until this is yes AND the feed is approved on the host
# via nodeguard-feeds apply --feed <id> --confirm (the double gate).
# NOTE: this file is reinstalled by deploy.sh on every deploy; edits made
# on the live host are reverted. Edit the repo/host-dir copy and deploy.
FEEDS_ENFORCE=no
FEEDS_APPLY=""
FEEDS_DRYRUN="spamhaus_drop_v4 spamhaus_drop_v6 dshield_top20"
FEEDS_TTL_S=90000
FEEDS_MAX_V4=8192
FEEDS_MAX_V6=2048
FEEDS_MAX_BYTES=4194304
FEEDS_V6_FLOOR=19
FEEDS_MAX_COVERAGE_V4=67108864
FEEDS_MAX_COVERAGE_V6_48=46137344
# Churn brake: hold a feed whose composition moved further than this from its
# last applied set, pending review. The measure is the symmetric difference
# over the baseline size, so a removed key and an added key both count and the
# scale runs to 200 percent, not 100: swapping 7 of 10 entries scores 140, and
# a total replacement scores 200. 30 is therefore tighter than it reads.
FEEDS_MAX_CHURN_PCT=30
# Per feed, overriding the global above, named FEEDS_MAX_CHURN_PCT_<FEED_ID>
# with the id uppercased. A percentage has no resolution on a small baseline:
# dshield_top20 publishes the 19 busiest attacking networks and rotating is
# the point of it, so it scores about 137 every day and a 30 percent brake
# holds it on every run forever, while spamhaus_drop's thousands of
# slow-moving entries never approach the same number. Set this above the
# feed's normal daily movement; 200 or more disables the brake for that feed.
#FEEDS_MAX_CHURN_PCT_DSHIELD_TOP20=150
#
# Raising the threshold does not clear a hold that has already latched. That
# is `nodeguard-feeds apply --feed <id> --confirm`, which shows the pending
# diff, records the approval, and re-baselines on the next successful run.
FEEDS_MAX_STALE_S=1209600
